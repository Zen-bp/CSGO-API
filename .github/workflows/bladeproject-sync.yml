# bladeproject: keeps this fork current on its own.
# Every 3 hours: takes the scripts from ByMykel/CSGO-API (code only: our data, state files and workflows stay ours),
# then regenerates the data for vars.LANGUAGES. update.js / group.js exit early when the game manifest and images.json
# did not change, so an idle run takes about a minute and commits nothing. New upstream code regenerates everything.
# Language folders are the ones from upstream constants.js (Ukrainian is "uk"): vars.LANGUAGES = en,ru,uk.
# The site (bladeproject.net) watches the latest commit of main and rebuilds its skin catalog from public/api/{en,uk}.
# Do not press "Sync fork" in the GitHub UI: this workflow does the syncing, a merge would conflict with our data.
name: bladeproject sync

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate data even if the game manifest did not change"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: bladeproject-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LANGUAGES: ${{ vars.LANGUAGES || 'en,uk' }}

    steps:
      - uses: actions/checkout@v7

      - name: Take scripts from upstream
        id: upstream
        run: |
          git fetch --depth=1 https://github.com/ByMykel/CSGO-API.git main
          echo "sha=$(git rev-parse --short FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          # Root *.txt are the state files (manifestId*, imagesSha*): ours, or update.js would think nothing changed.
          git checkout FETCH_HEAD -- . ':(exclude)public' ':(exclude).github' ':(exclude,glob)*.txt'
          if [ -n "$(git status --porcelain)" ]; then
            echo "upstream code changed, data will be regenerated:"; git status --short | head -50
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Update data
        run: node update.js ${{ (inputs.force || steps.upstream.outputs.changed == '1') && '--force' || '' }} --languages "$LANGUAGES"

      - name: Group data
        run: node group.js ${{ (inputs.force || steps.upstream.outputs.changed == '1') && '--force' || '' }} --languages "$LANGUAGES"

      # GitHub rejects the whole push if one file is over 100 MiB (ru/uk all.json are ~92 MB and grow). Such a file keeps
      # its previous version, the rest of the data still goes out. The site does not read all.json.
      - name: Keep files under GitHub's size limit
        run: |
          git ls-files -m -o --exclude-standard | while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            if [ "$size" -gt 99614720 ]; then
              echo "::warning::$f is $((size / 1048576)) MB, over the limit: previous version kept"
              git checkout -- "$f" 2>/dev/null || rm -f "$f"
            fi
          done

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "[bot::sync] manifest $(cat manifestIdUpdate.txt), upstream ${{ steps.upstream.outputs.sha }}"
          git push
